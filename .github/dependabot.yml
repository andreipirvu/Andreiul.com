# Keep pins current (R-08). Dependabot opens a pull request per update, which goes
# through the same pipeline. The cooldown holds every new release back for 7 days:
# a compromised release is usually caught and pulled within days.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /nginx
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
