# Weekly check of the live site: version banner, security headers, HTTPS redirect,
# exposed dotfiles, security.txt (R-04, R-05, R-06). A failed run is the alert:
# GitHub emails the repository owner when a scheduled workflow fails.
name: site-monitor
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/check-live-headers.sh https://www.andreiul.com
