# Stack output (Lab 5 Part E). OpenSearch runs with its self-signed demo certificate,
# so verification is off here: acceptable on this local lab stack and nowhere else.
output {
  opensearch {
    hosts => ["https://opensearch:9200"]
    index => "suricata-%{+YYYY.MM.dd}"
    user => "admin"
    password => "${OPENSEARCH_INITIAL_ADMIN_PASSWORD}"
    ssl => true
    ssl_certificate_verification => false
  }
}
