# Lab 3 front door: TLS from the lab CA in front of OpenSearch Dashboards.
# Hardened the same way as the live site (R-05, R-11): no version banner, TLS 1.2+.

server_tokens off;

server {
    listen 443 ssl;
    http2 on;
    server_name localhost frontdoor.lab;

    ssl_certificate     /etc/nginx/certs/frontdoor.crt;   # leaf + intermediate
    ssl_certificate_key /etc/nginx/certs/frontdoor.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://opensearch-dashboards:5601;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
