# nginx site config for www.andreiul.com (R-04, R-05).
# Install: see deploy/nginx/README.md. Test before reload: sudo nginx -t
#
# Assumptions to check against the server before deploying:
#   - files are served from /var/www/andreiul.com (the contents of site/)
#   - certificates come from certbot under /etc/letsencrypt/live/andreiul.com/
#   - snippets/security-headers.conf is copied to /etc/nginx/snippets/

# Hide the nginx version in the Server header and on error pages (R-04).
server_tokens off;

# HTTP: only ACME challenges, everything else goes to HTTPS on the canonical host.
server {
    listen 80;
    listen [::]:80;
    server_name andreiul.com www.andreiul.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/andreiul.com;
    }

    location / {
        return 301 https://www.andreiul.com$request_uri;
    }
}

# HTTPS on the bare domain: redirect to www (og:url and every internal link use www).
server {
    # 'listen ... http2' works on nginx 1.18 and 1.24; on 1.25.1+ switch to 'http2 on;'.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name andreiul.com;

    ssl_certificate     /etc/letsencrypt/live/andreiul.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/andreiul.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include snippets/security-headers.conf;
    return 301 https://www.andreiul.com$request_uri;
}

server {
    # 'listen ... http2' works on nginx 1.18 and 1.24; on 1.25.1+ switch to 'http2 on;'.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.andreiul.com;

    root  /var/www/andreiul.com;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/andreiul.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/andreiul.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # A static site only needs GET and HEAD.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Never serve dotfiles (.git, .env, editor backups), except /.well-known/.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    location = /.well-known/security.txt {
        include snippets/security-headers.conf;
        default_type text/plain;
        charset utf-8;
    }

    # Content-Security-Policy per page. Each page gets the narrowest policy that lets it run.

    # SnipLearn: React and Babel from cdnjs (pinned with SRI). Babel compiles JSX in the
    # browser, which needs 'unsafe-eval' and 'unsafe-inline'. Precompiling the JSX would
    # let this page drop both.
    location = /app.html {
        include snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    }

    # Weather Cipher and Uni Calendar: inline <script> and onclick handlers.
    location ~ ^/(crypto|calendaruni)\.html$ {
        include snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    }

    # Main page and everything else: no inline script at all.
    location / {
        include snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        try_files $uri $uri/ =404;
    }
}
