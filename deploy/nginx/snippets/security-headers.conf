# Common security headers for andreiul.com / www.andreiul.com (R-05).
# Install: /etc/nginx/snippets/security-headers.conf
#
# nginx only inherits add_header from the outer level when a location defines none of
# its own. Every location that sets a Content-Security-Policy must therefore include
# this file as well, or these headers silently disappear for that location.
#
# HSTS deliberately has no includeSubDomains: it would also force HTTPS on every
# subdomain (jobs, birds and any future one), which is a separate decision.

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
